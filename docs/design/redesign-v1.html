<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molly redesign, concept v1 (mockup, placeholder data)</title>
<!--
  Molly redesign concept v1 (PLAN-1 WS155). Self-contained: no build step, no framework.
  Only outside request: Inter from Google Fonts (falls back to the system sans if offline).
  All names, companies and figures are placeholders. Words marked data-nl are NEW labels for Nosa:
  press the "Show new labels" button in the strip to outline them.
  Rationale and token table: docs/design/redesign-v1.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens: Molly's own values (see redesign-v1.md, section 2) ─────────────── */
:root[data-theme="light"]{
  --back:#E3E6EA; --bg:#FFFFFF; --side:#F4F5F7; --pane:#FAFBFC; --raise:#F0F2F4; --raise2:#E6E9ED;
  --hover:rgba(18,24,38,.035); --sel:rgba(18,24,38,.06); --open:rgba(18,24,38,.085);
  --line:rgba(18,24,38,.09); --line2:rgba(18,24,38,.17); --ctl:#858C97;
  --t1:#15181D; --t2:#474D57; --t3:#5A616C;
  --accent:#44688E; --accent-h:#3A5876; --on-accent:#FFFFFF; --accent-soft:rgba(68,104,142,.10);
  --done:#1B7448; --done-soft:rgba(27,116,72,.10);
  --stuck:#B3362A; --stuck-soft:rgba(179,54,42,.08);
  --warn:#8A5A0B; --warn-soft:rgba(138,90,11,.10);
  --tone-stone-fill:#E7E4DA; --tone-stone-ink:#46443C; --tone-sky-fill:#DCE7F3; --tone-sky-ink:#2C4459;
  --tone-sage-fill:#E3E8D0; --tone-sage-ink:#4A5524; --tone-clay-fill:#F4E0D6; --tone-clay-ink:#8F4A30;
  --tone-sand-fill:#F1E4C8; --tone-sand-ink:#6B4A0E; --tone-amber-fill:#F8EBC9; --tone-amber-ink:#6B4A0E;
  --float:0 12px 32px -8px rgba(18,24,38,.22),0 0 0 1px rgba(18,24,38,.08); --scrim:rgba(18,24,38,.30);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --back:#0A0B0D; --bg:#14171B; --side:#0E1013; --pane:#191C21; --raise:#20242A; --raise2:#292E36;
  --hover:rgba(255,255,255,.04); --sel:rgba(255,255,255,.07); --open:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --ctl:#6E7681;
  --t1:#E9ECF0; --t2:#A7AEB9; --t3:#9AA1AC;
  --accent:#7BA9DD; --accent-h:#93BAE6; --on-accent:#0C1522; --accent-soft:rgba(123,169,221,.16);
  --done:#5BC48E; --done-soft:rgba(91,196,142,.16);
  --stuck:#F2877C; --stuck-soft:rgba(242,135,124,.14);
  --warn:#E0A640; --warn-soft:rgba(224,166,64,.14);
  --tone-stone-fill:#2A2D33; --tone-stone-ink:#C9CDD4; --tone-sky-fill:#1F3249; --tone-sky-ink:#B9D3F0;
  --tone-sage-fill:#27301D; --tone-sage-ink:#C5D69A; --tone-clay-fill:#3D2620; --tone-clay-ink:#F0B5A0;
  --tone-sand-fill:#38301A; --tone-sand-ink:#E8CF93; --tone-amber-fill:#3A2F14; --tone-amber-ink:#EDCB7E;
  --float:0 14px 36px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08); --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{ --sky:#5B8DC5; /* the wordmark underscore: brand Sky, fixed in both themes */
  --ease:cubic-bezier(.2,.7,.2,1); --f:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }

*{box-sizing:border-box;margin:0}
body{background:var(--back);color:var(--t1);font:400 13px/20px var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
svg{display:block;flex:none}

/* ── Mockup strip (not part of the design) ───────────────────────────────────── */
.strip{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.strip h1{font:600 13px/20px var(--f);margin-right:4px}
.seg{display:inline-flex;background:var(--raise2);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:3px 10px;border-radius:6px;color:var(--t2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--t1);box-shadow:0 0 0 1px var(--line)}
.tog{padding:3px 10px;border-radius:8px;border:1px solid var(--line2);color:var(--t2);font-weight:500}
.tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.hint{color:var(--t3);margin-left:auto}
.stage{display:grid;place-items:start center;padding:24px 16px 8px}
.legend{max-width:1200px;margin:16px auto 48px;padding:0 16px;color:var(--t2)}
.legend h2{font:600 13px/20px var(--f);color:var(--t1);margin-bottom:8px}
.legend .row2{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-bottom:12px}
.legend .it{display:flex;gap:8px;align-items:center}
body.hl [data-nl]{outline:1px dashed #D946B0;outline-offset:2px;border-radius:3px}

/* ── App frame ───────────────────────────────────────────────────────────────── */
.app{position:relative;display:grid;grid-template-columns:224px minmax(0,1fr);width:min(1200px,100%);height:720px;background:var(--bg);color:var(--t1);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.app.phone{grid-template-columns:minmax(0,1fr);width:390px;height:800px;border-radius:28px}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.phone .side{position:absolute;z-index:30;inset:0 auto 0 0;width:292px;transform:translateX(-102%);transition:transform 200ms var(--ease);border-right:1px solid var(--line2)}
.phone.drawer .side{transform:none}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:25;opacity:0;pointer-events:none;transition:opacity 160ms}
.drawer .scrim{opacity:1;pointer-events:auto}
.brand{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--t1)}
.brand svg{height:16px;width:auto}
.jump{margin:0 8px 8px;height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;background:var(--bg);box-shadow:0 0 0 1px var(--line2);color:var(--t2)}
.jump:hover{box-shadow:0 0 0 1px var(--ctl)}
.jump .k{margin-left:auto}
kbd{font:500 11px/16px var(--mono);color:var(--t3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:transparent}
.nav{flex:1;overflow:auto;padding:0 8px 8px}
.nav h4{font:500 12px/18px var(--f);color:var(--t3);padding:12px 8px 4px}
.ni{display:flex;align-items:center;gap:8px;height:28px;width:100%;padding:0 8px;border-radius:6px;color:var(--t2);transition:background 80ms}
.phone .ni{height:44px}
.ni:hover{background:var(--hover)}
.ni[aria-current="page"]{background:var(--sel);color:var(--t1);font-weight:500}
.ni .n{margin-left:auto;color:var(--t3);font-size:12px}
.ni .n.hot{color:var(--t1);font-weight:600}
.foot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 8px}
.me b{font-weight:500;flex:1}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.ib:hover{background:var(--hover);color:var(--t1)}
.phone .ib{width:44px;height:44px}
.oldlook{height:24px;padding:0 8px;color:var(--t3);font-size:12px;border-radius:6px;text-align:left}
.oldlook:hover{background:var(--hover);color:var(--t2)}

/* main */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.hd{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.hd h2{font:500 13px/20px var(--f)}
.hd .ct{color:var(--t3)}
.hd .sp{flex:1}
.phone .hd{height:52px;padding:0 4px 0 4px}
.chips{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);overflow:hidden}
.chip{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.chip.unset{border:1px dashed var(--ctl);color:var(--t2)}
.chip.unset:hover{background:var(--hover)}
.chip.set{background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.set b{font-weight:400;color:var(--t2)}
.clear{font-size:12px;color:var(--t2);padding:0 6px;height:24px;border-radius:6px}
.clear:hover{background:var(--hover)}
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
.listwrap{container-type:inline-size}

/* groups and rows */
.gh{position:sticky;top:0;z-index:2;height:32px;display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--side);border-bottom:1px solid var(--line);font:500 12px/18px var(--f);color:var(--t2);width:100%}
.gh .ct{color:var(--t3);font-weight:400}
.gh svg{transition:transform 120ms}
.gh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.gh.hotg{color:var(--stuck)}
.rows{display:grid;transition:grid-template-rows 160ms var(--ease);grid-template-rows:1fr}
.rows>div{overflow:hidden}
.rows.closed{grid-template-rows:0fr}
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:38px;padding:0 16px;border-bottom:1px solid var(--line);cursor:default;transition:background 80ms,opacity 120ms}
.row:hover{background:var(--hover)}
.row.cur{background:var(--sel)}
/* One cursor language for rows and tiles (approved 2026-11-16): the wordmark's underscore, a Sky block on the cursor item's
   bottom-left, on the tile's lower edge or the row's divider. The tile also steps one tone up. No left-edge bars anywhere. */
.row.cur::before,.tile.cur::before{content:"";position:absolute;pointer-events:none;z-index:1;background:var(--accent)}
.row.cur::before{left:16px;bottom:-1px;width:18px;height:3px}
.tile.cur::before{left:12px;bottom:-2px;width:18px;height:4px}
.row.open{background:var(--open)}
.row .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti i{font-style:normal;color:var(--t3);margin-left:8px}
.row .rt{display:flex;align-items:center;gap:14px;color:var(--t3);font-size:12px;flex:none}
.row .rt .stuck{color:var(--stuck)} .row .rt .warn{color:var(--warn)}
.row .age{width:28px;text-align:right}
.row.leaving{opacity:0;max-height:0;min-height:0;overflow:hidden;border-width:0;transition:opacity 120ms,max-height 160ms 120ms,min-height 160ms 120ms}
.row{max-height:80px}
@container (max-width:560px){.listwrap .c-cad{display:none}}
@container (max-width:430px){.listwrap .c-own{display:none}}
.phone .row{flex-wrap:wrap;min-height:56px;padding:9px 16px;gap:2px 10px}
.phone .row .ti{white-space:normal;flex:1 1 0}
.c-own{display:inline-flex;gap:6px;align-items:center;width:88px}
.rows>div{min-height:0}
.phone .row .rt{flex-basis:100%;padding-left:24px;gap:10px}
.phone .row .age{width:auto}
.empty{display:grid;place-items:center;text-align:center;padding:72px 24px;gap:12px;color:var(--t2);height:100%}
.empty b{display:block;color:var(--t1);font-weight:500;font-size:14px;margin-bottom:2px}
.sec{padding:20px 16px 24px}
.sec h3{font:500 12px/18px var(--f);color:var(--t3);margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.phone .kpis{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--raise);border-radius:10px;padding:10px 12px}
.kpi span{display:block;color:var(--t3);font-size:12px}
.kpi b{font:600 20px/28px var(--f);letter-spacing:-.012em}

/* marks: identity. disc = person, rounded square = company */
.mk{--s:16px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);color:#14161A;font:600 calc(var(--s)*.58)/1 var(--f);box-shadow:inset 0 0 0 1px rgba(20,22,26,.14)}
.mk.sq{border-radius:calc(var(--s)*.3)}
.mk.l{--s:28px}
.stack .mk+.mk{margin-left:-4px;box-shadow:inset 0 0 0 1px rgba(20,22,26,.14),0 0 0 2px var(--bg)}
/* state glyphs */
.g{width:14px;height:14px}
.g.acc{color:var(--accent)} .g.warn{color:var(--warn)} .g.stuck{color:var(--stuck)} .g.done{color:var(--done)}

/* buttons */
.btn{height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:6px;font-weight:500;white-space:nowrap;transition:background 80ms,transform 80ms}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h)}
.btn.pri kbd{color:inherit;opacity:.85;border-color:currentColor}
.btn:active{transform:translateY(1px)}
.btn.sec{box-shadow:0 0 0 1px var(--line2);color:var(--t1)}
.btn.sec:hover{background:var(--hover)}
.phone .btn{height:44px;padding:0 16px}

/* pane */
.pane{position:absolute;z-index:10;top:0;right:0;bottom:0;width:min(58%,620px);background:var(--pane);border-left:1px solid var(--line2);display:flex;flex-direction:column;transform:translateX(12px);opacity:0}
.pane.in{transform:none;opacity:1;transition:transform 160ms var(--ease),opacity 160ms var(--ease)}
.phone .pane{width:100%;border-left:0;z-index:20;transform:translateX(24px)}
.crumb{height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);color:var(--t2)}
.crumb .sp{flex:1}
.crumb .back{display:none}
.phone .crumb{height:52px;padding:0 4px}
.phone .crumb .back{display:grid}
.pbody{flex:1;overflow:auto;padding:24px}
.phone .pbody{padding:20px 16px}
.pin{max-width:720px}
.pin h1{font:600 20px/28px var(--f);letter-spacing:-.012em;display:flex;gap:10px;align-items:center}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.prop{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;background:var(--raise);color:var(--t2);font-size:12px}
.prop.tone{font-weight:500}
.card{position:relative;background:var(--raise);border-radius:10px;padding:16px;margin-bottom:24px}
.card h5{font:500 13px/20px var(--f);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.card p{color:var(--t2);margin-bottom:12px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card.hot h5{color:var(--stuck)}
.pin h3{font:500 12px/18px var(--f);color:var(--t3);margin:0 0 6px}
.pin section{margin-bottom:22px}
.pin section p{color:var(--t2)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:4px 12px}
.kv dt{color:var(--t3)} .kv dd{margin:0}
.hist{list-style:none;padding:0;display:grid;gap:6px;color:var(--t2)}
.hist li{display:flex;gap:10px} .hist time{color:var(--t3);width:56px;flex:none}
.pin a{color:var(--accent);text-decoration:none} .pin a:hover{text-decoration:underline}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;padding:12px 16px;min-height:100%;align-items:start}
.phone .board{grid-template-columns:repeat(4,264px);overflow:visible}
.col{min-width:0}
.col .ch{position:sticky;top:0;display:flex;align-items:center;gap:8px;height:28px;font:500 12px/18px var(--f);color:var(--t2);background:var(--bg);z-index:1}
.col .ch .ct{color:var(--t3);font-weight:400}
.col .ch.hotc,.col .ch.hotc .ct{color:var(--stuck)} .col .ch.hotc{font-weight:600}
.tile{--tb:var(--raise);position:relative;display:block;width:100%;background-color:var(--tb);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:background-color 80ms}
.tile:hover,.tile.cur{--tb:var(--raise2)}
.tile.open{--tb:var(--raise2);box-shadow:0 0 0 1px var(--ctl)}
/* Blocked / urgent: one language everywhere. A red dog-ear in the top-right corner (a shape nothing else has), clipped to the
   container's own radius. Used on blocked tiles and on the pane's action card. The glyph-and-word line stays, so it is never colour alone. */
.tile.blocked::after,.card.hot::after{content:"";position:absolute;top:0;right:0;width:14px;height:14px;border-top-right-radius:inherit;background:linear-gradient(225deg,var(--stuck) 50%,transparent 50%);pointer-events:none}
.tile .top{display:flex;align-items:center;margin-bottom:6px;color:var(--t3);font-size:12px}
.tile .top .sp{flex:1}
.tile .more{opacity:0;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--t2);margin-left:6px}
.tile:hover .more,.tile.cur .more{opacity:1}
.tile .tt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.done .tt{color:var(--t3)}
.tile .mkr{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--t3)}
.tile .mkr.stuck{color:var(--stuck);font-weight:500} .tile .mkr.done{color:var(--done)}
.addc{color:var(--t3);font-size:12px;height:28px;width:100%;padding:0 4px;border-radius:6px}
.addc:hover{background:var(--hover);color:var(--t2)}

/* founder (phone) */
.fhd{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 4px;border-bottom:1px solid var(--line)}
.fhd .brandm{color:var(--t1);display:flex;align-items:center;padding:0 6px}
.fhd .brandm svg{height:15px;width:auto}
.cosw{margin-left:auto;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:8px;color:var(--t1);font-weight:500}
.cosw:hover{background:var(--hover)}
.fmain{padding:20px 16px 32px}
.hero{background:var(--raise);border-radius:12px;padding:16px;margin-bottom:24px}
.hero small{display:block;color:var(--t3);font-size:12px;margin-bottom:4px}
.hero h2{font:600 20px/28px var(--f);letter-spacing:-.012em;margin-bottom:4px}
.hero p{color:var(--t2);margin-bottom:16px}
.hero .btn{width:100%;justify-content:center}
.fsec h3{font:500 12px/18px var(--f);color:var(--t3);margin:0 0 4px;padding:0 0}
.fsec{margin-bottom:24px}
.frow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);padding:8px 0}
.frow .tx{flex:1;min-width:0}
.frow .tx span{display:block;color:var(--t3);font-size:12px}
.frow .v{font-weight:500}
.frow .v small{display:block;font-size:12px;color:var(--done);text-align:right;font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* palette, toast */
.pal{position:absolute;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:72px;background:var(--scrim)}
.pal>div{width:min(520px,92%);background:var(--pane);border-radius:12px;box-shadow:var(--float);overflow:hidden}
.pal input{width:100%;height:48px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--t1);font:400 14px/20px var(--f);padding:0 16px;outline:0}
.pal ul{list-style:none;padding:6px;max-height:300px;overflow:auto}
.pal h6{font:500 12px/18px var(--f);color:var(--t3);padding:8px 10px 2px}
.pal li button{width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px}
.pal li button[aria-selected="true"]{background:var(--sel)}
.pal li button kbd{margin-left:auto}
.toast{position:absolute;z-index:60;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pane);box-shadow:var(--float);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:16px;align-items:center;white-space:nowrap;animation:tin 160ms var(--ease)}
.toast button{color:var(--accent);font-weight:500;padding:4px 8px;border-radius:6px}
.toast button:hover{background:var(--hover)}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="stage"><div id="root"></div></div>
<div class="legend" id="legend"></div>
<script>
/* ── Placeholder data. Every name, company and number is made up. ─────────── */
const ME = "Sam Admin";
const SIGNUPS = [
  { n: "Sam Founder", e: "sam@example.com",  co: "Acme Ltd",    match: "Acme Ltd",    age: "2d" },
  { n: "Jo Example",  e: "jo@example.com",   co: "Example Co",  match: null,          age: "1d" },

const POOL = [["lime","#B7D86A"],["teal","#6CCBC6"],["indigo","#9A96F0"],["violet","#B493F0"],["orchid","#D08CE6"],["magenta","#EA8DC3"],["stone","#C9C2B6"],["slate","#A9B6C6"]];
function fnv1a(s){ let h = 2166136261; for (const ch of s.trim().toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
const fill = n => POOL[fnv1a(n) % POOL.length][1];

function needsRows(){

  r.push({ id:"q-board", g:"On the board", gl:G.queue, t:"1 board item needs review", d:"Names or projects Molly could not match.", kind:"Team Board", age:"1d" });
  for (const a of ALERTS) if (!S.gone.has(a.id)) r.push({ id:a.id, g:"Alerts", gl:G.alert, co:a.co, t:`${a.co}: ${a.msg}`, kind:"Metric alert", age:a.age });
  for (const o of OVERDUE) r.push({ id:o.id, g:"Behind on updates", gl:G.clock(o.sev?"stuck":"warn"), co:o.co, t:`${o.co}`, d:`${o.days} days since the last update`, sev:o.sev, kind:"Behind", age:o.days+"d" });
  return r;
}
function needsHTML(){
  const rows = needsRows();

  const groups = ["Waiting on you","On the board","Alerts","Behind on updates"];
  const body = groups.map(g => { const rs = rows.filter(r=>r.g===g); if(!rs.length) return "";

    card:{ h:"Check the figure", t:"If this is expected, dismiss the alert.", p:"Dismiss alert", pk:"D", s:"Open company", sk:"O" },
    body:figures()+hist([[al.age+" ago","Alert raised"]]) };
  const od = OVERDUE.find(o=>o.id===id) ?? OVERDUE.find(o=>o.co===id);
  const co = companyList().find(c=>c.id===id) ?? (od && companyList().find(c=>c.id===od.co));
  if (co){
    const late = co.days>=20;
    return { crumb: S.screen===1?"Behind on updates":"Companies", title:co.name, mkn:[co.name,"co"],
      props:[`<span class="prop tone" style="background:var(--tone-sky-fill);color:var(--tone-sky-ink)">${co.stage}</span>`,`<span class="prop">${mk(co.own,"p")}${co.own}</span>`,`<span class="prop">${co.cad} updates</span>`],
      card: late ? { h:`No update for ${co.days} days`, t:`The last update was ${co.days} days ago. A reminder goes to the company's founders by email.`, p:"Send a reminder", pk:"R", s:"Open company", sk:"O" }
                 : { h:"Up to date", t:`The last update was ${co.days} days ago. Nothing to do.`, p:"Open company", pk:"O" },
      body:figures()+`<section><h3>${NL("Recent updates")}</h3><ul class="hist"><li><time>${co.days}d ago</time><span>${co.cad==="Monthly"?"October":"Q3"} update</span></li><li><time>${co.days+30}d ago</time><span>${co.cad==="Monthly"?"September":"Q2"} update</span></li></ul></section>` };
  }
  const c = CARDS.find(x=>x.id===id);
  if (c) return { crumb:`Team Board · ${COLS[c.col]}`, title:c.t, props:[`<span class="prop"><span class="stack" style="display:inline-flex">${c.own.map(o=>mk(o,"p")).join("")}</span>${c.own.join(", ")}</span>`, c.due?`<span class="prop">Due ${c.due}</span>`:"", `<span class="prop">${COLS[c.col]}</span>`],
    /* Blocked: the action card carries the same red dog-ear as the tile; primary is a one-click move to In progress. Plain items have no card, only Edit. */
    card: c.col===2 ? { hot:true, h:`${G.waiting.replace('class="g stuck"','class="g stuck" style="width:16px;height:16px"')}${NL("Blocked")}`, t:"This item is stuck. When that's cleared, mark it as unblocked and it moves to In progress.", p:"Mark as unblocked", pk:"U", s:"Edit", sk:"E" } : null,
    edit: c.col!==2,
    body:`<section><h3>Notes</h3><p>${c.col===2?"Confirm the monthly revenue and cash figures against the update before the report is drafted.":"No notes yet."}</p></section>
      ${c.col===2?`<section><h3>Proof links</h3><p><a href="#" onclick="return false">example.com/figures</a></p></section>`:""}
      ${hist([["2d ago",`${c.own[0]} moved this to ${COLS[c.col]}`],["5d ago","Item created"]])}` };
  return null;
}
function paneHTML(){
  const d = paneData(); if (!d) return "";
  const k = d.card;
  return `<aside class="pane ${S.fresh?"":"in"}" id="pane" role="complementary" aria-label="${d.title}">
    <div class="crumb"><button class="ib back" data-act="close" aria-label="Back to the list">${IC.back}</button>
      <span>${d.crumb}</span><span class="sp"></span>
      <button class="ib" data-act="prev" aria-label="Previous">${IC.up}</button><button class="ib" data-act="next" aria-label="Next">${IC.down}</button>
      <button class="ib" data-act="expand" aria-label="Open full page">${IC.expand}</button>
      <button class="ib" data-act="close" aria-label="Close">${IC.x}</button></div>
    <div class="pbody"><div class="pin"><h1>${d.mkn?mk(d.mkn[0],d.mkn[1],true):""}<span>${d.title}</span></h1>
      <div class="props">${d.props.join("")}</div>
      ${d.edit?`<div class="acts" style="margin:-8px 0 24px"><button class="btn sec" data-act="secondary">${NL("Edit")}${phone()?"":`<kbd>E</kbd>`}</button></div>`:""}
      ${k?`<div class="card ${k.hot?"hot":""}"><h5>${k.h}</h5><p>${k.t}</p><div class="acts">
        <button class="btn pri" data-act="primary">${NL(k.p)}${phone()?"":`<kbd>${k.pk}</kbd>`}</button>
        ${k.s?`<button class="btn sec" data-act="secondary">${NL(k.s)}${phone()?"":`<kbd>${k.sk}</kbd>`}</button>`:""}</div></div>`:""}
      ${d.body}</div></div></aside>`;
}

/* ── Palette and toast ───────────────────────────────────────────────────── */
function palItems(){
  const a = [
    { l:S.theme==="dark"?"Switch to light mode":"Switch to dark mode", k:"", run:()=>{S.theme=S.theme==="dark"?"light":"dark";} , g:"Actions" },
    { l:"Use the old look", k:"", run:()=>toast("Back to the old look (not in this mockup)"), g:"Actions" },
    { l:"Needs you", k:"g d", run:()=>go(1), g:"Go to" }, { l:"Companies", k:"g c", run:()=>go(2), g:"Go to" },
    { l:"Team Board", k:"g b", run:()=>go(3), g:"Go to" }, { l:"Approvals", k:"g a", run:()=>toast("Not in this mockup"), g:"Go to" },
  ];
  const q = S.palQ.toLowerCase(); return a.filter(x=>x.l.toLowerCase().includes(q));
}
function palHTML(){
  if (!S.pal) return "";
  const items = palItems(); let last="";
  return `<div class="pal" data-act="palclose"><div role="dialog" aria-label="Search or jump to" data-stop>
    <input id="palq" placeholder="Search or jump to…" value="${S.palQ}" autocomplete="off">
    <ul>${items.map((x,i)=>{ const h = x.g!==last? `<h6>${NL(x.g)}</h6>`:""; last=x.g;
      return `<li>${h}<button data-pal="${i}" aria-selected="${i===S.palI}">${x.l}${x.k?`<kbd>${x.k}</kbd>`:""}</button></li>`; }).join("")}</ul></div></div>`;
}
function toast(msg, undo){ S.toast={msg,undo}; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{S.toast=null;render();},4500); render(); }

/* ── Render ──────────────────────────────────────────────────────────────── */
function render(){
  const root = document.getElementById("root");
  const keep = root.querySelector(".scroll")?.scrollTop || 0;
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle("hl", S.hl);
  const ph = phone();
  let main;
  if (S.screen===1) main = needsHTML(); else if (S.screen===2) main = companiesHTML(); else if (S.screen===3) main = boardHTML(); else main = founderHTML();
  root.innerHTML = `<div class="app ${ph?"phone":""} ${S.drawer?"drawer":""}">${sideHTML()}<div class="scrim" data-act="drawer"></div>
    <main class="main">${main}${S.screen<4?paneHTML():""}</main>${palHTML()}
    ${S.toast?`<div class="toast" role="status"><span>${S.toast.msg}</span>${S.toast.undo?`<button data-act="undo">${NL("Undo")}</button>`:""}</div>`:""}</div>`;
  const sc = root.querySelector(".scroll"); if (sc) sc.scrollTop = keep;
  if (S.fresh){ S.fresh=false; requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById("pane")?.classList.add("in"))); }
  if (S.pal) { const i = document.getElementById("palq"); i.focus(); i.setSelectionRange(S.palQ.length,S.palQ.length); }
  strip();
}
function strip(){
  const sb = (grp, items) => `<div class="seg" role="group" aria-label="${grp}">${items.map(([k,l,on])=>`<button data-s="${grp}:${k}" aria-pressed="${on}">${l}</button>`).join("")}</div>`;
  document.getElementById("strip").innerHTML = `<h1>Molly redesign · concept v1</h1>
    ${sb("screen",[[1,"1 · Needs you",S.screen===1],[2,"2 · Companies",S.screen===2],[3,"3 · Team Board",S.screen===3],[4,"4 · Founder",S.screen===4]])}
    ${sb("theme",[["light","Light",S.theme==="light"],["dark","Dark",S.theme==="dark"]])}
    ${S.screen===4?`<span class="hint">Founder screens are designed phone first</span>`:sb("device",[["desktop","Desktop",S.device==="desktop"],["phone","Phone",S.device==="phone"]])}
    <button class="tog" data-s="hl" aria-pressed="${S.hl}">Show new labels</button>
    ${S.screen===1?`<button class="tog" data-s="empty" aria-pressed="${S.empty}">Empty state</button>`:""}
    <span class="hint">Click a row · j k Enter Esc · ⌘K · A approves, D dismisses</span>`;
}

/* ── Behaviour ───────────────────────────────────────────────────────────── */
function flat(){
  if (S.screen===1) return needsRows().filter(r=>!S.collapsed[r.g]).map(r=>r.id);
  if (S.screen===2) return companyList().filter(c=>!S.collapsed[c.g]).map(c=>c.id);
  if (S.screen===3) return CARDS.slice().sort((a,b)=>a.col-b.col).map(c=>c.id);
  return [];
}
function go(n){ S.screen=n; S.open=null; S.cur=n===3?"c5":null; /* board starts with the cursor on a tile beside the waiting one, so both markers show */ S.pal=false; S.drawer=false; S.collapsed={}; render(); }
function openRow(id){ const was=S.open; S.open=id; S.cur=id; S.fresh=!was; if(id==="q-approvals") S.su=0; render(); }
function step(dir){
  const ids = flat(); if(!ids.length) return;
  if (S.open==="q-approvals"){ const n=SIGNUPS.length-S.approved.length; const t=S.su+dir; if(t>=0&&t<n){S.su=t;render();return;} }
  const i = ids.indexOf(S.cur ?? S.open); const j = Math.max(0, Math.min(ids.length-1, i<0?0:i+dir));
  S.cur = ids[j]; if (S.open) { S.open=ids[j]; if(ids[j]==="q-approvals") S.su=0; }
  render(); document.querySelector(".cur")?.scrollIntoView({block:"nearest"});
}
function primary(){
  const id=S.open; if(!id) return;
  if (id==="q-approvals"){
    const remaining = SIGNUPS.map((s,i)=>i).filter(i=>!S.approved.includes(i)); const idx = remaining[Math.min(S.su,remaining.length-1)];
    S.approved.push(idx); const name=SIGNUPS[idx].n;
    if (SIGNUPS.length-S.approved.length===0) S.open=null; else S.su=Math.min(S.su,SIGNUPS.length-S.approved.length-1);
    S.undo = ()=>{ S.approved=S.approved.filter(x=>x!==idx); S.open="q-approvals"; S.su=Math.max(0,remaining.indexOf(idx)); };
    toast(`Approved ${name}.`, true); return;
  }
  const al = ALERTS.find(a=>a.id===id);
  if (al){ const el=document.querySelector(`[data-row="${id}"]`); el?.classList.add("leaving");
    setTimeout(()=>{ S.gone.add(id); S.open=null; S.cur=null; S.undo=()=>{S.gone.delete(id);S.open=id;S.cur=id;}; toast("Alert dismissed.",true); },280); return; }
  const d = paneData();
  if (d?.card?.p==="Send a reminder") return toast(`Reminder sent to ${(companyList().find(c=>c.id===id)||{}).fn||"the founder"}.`);
  if (d?.card?.p==="Mark as unblocked"){ const c=CARDS.find(x=>x.id===id); c.col=1; S.undo=()=>{c.col=2;}; return toast("Item unblocked.", true); }  /* one click: Blocked becomes In progress */
  toast("Opens the full page (not in this mockup)");
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-s],[data-act],[data-row],[data-group],[data-nav],[data-pal],[data-toast]"); if(!t) return;
  if (t.dataset.s){ const [k,v]=t.dataset.s.split(":");
    if(k==="screen") { go(+v); } else if(k==="theme") { S.theme=v; render(); }
    else if(k==="device") { S.device=v; S.open=null; S.drawer=false; render(); }
    else if(k==="hl") { S.hl=!S.hl; render(); } else if(k==="empty") { S.empty=!S.empty; render(); } return; }
  if (t.dataset.nav){ if(+t.dataset.nav) go(+t.dataset.nav); else toast("Not in this mockup"); return; }
  if (t.dataset.group){ S.collapsed[t.dataset.group]=!S.collapsed[t.dataset.group]; render(); return; }
  if (t.dataset.row){ openRow(t.dataset.row); return; }
  if (t.dataset.toast){ toast(t.dataset.toast); return; }
  if (t.dataset.pal!==undefined){ palItems()[+t.dataset.pal].run(); S.pal=false; render(); return; }
  const a = t.dataset.act;
  if (a==="palclose" && e.target.closest("[data-stop]")) return;
  ({ pal:()=>{S.pal=true;S.palQ="";S.palI=0;render();}, palclose:()=>{S.pal=false;render();},
     theme:()=>{S.theme=S.theme==="dark"?"light":"dark";render();}, old:()=>toast("Back to the old look (not in this mockup)"),
     drawer:()=>{S.drawer=!S.drawer;render();}, close:()=>{S.open=null;render();}, prev:()=>step(-1), next:()=>step(1),
     expand:()=>toast("Opens the full page at the same address"), primary, secondary:()=>toast("Not in this mockup"),
     undo:()=>{ S.undo&&S.undo(); S.undo=null; S.toast=null; render(); } }[a]||(()=>{}))();
});
document.addEventListener("input", e=>{ if(e.target.id==="palq"){ S.palQ=e.target.value; S.palI=0; render(); } });
document.addEventListener("keydown", e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); S.pal=!S.pal; S.palQ=""; S.palI=0; render(); return; }
  if (S.pal){
    const n = palItems().length;
    if (e.key==="Escape"){ S.pal=false; render(); }
    else if (e.key==="ArrowDown"){ e.preventDefault(); S.palI=(S.palI+1)%n; render(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); S.palI=(S.palI+n-1)%n; render(); }
    else if (e.key==="Enter"){ palItems()[S.palI]?.run(); S.pal=false; render(); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==="Escape"){ if(S.drawer){S.drawer=false;render();} else if(S.open){S.open=null;render();} return; }   // one layer at a time
  if (e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); step(1); }
  else if (e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); step(-1); }
  else if (e.key==="Enter" && S.cur && !S.open){ openRow(S.cur); }
  else if (S.open){ const d=paneData(); if(d?.card && e.key.toLowerCase()===d.card.pk.toLowerCase()) primary(); }
});

/* ── Legend: the identity marks, live ────────────────────────────────────── */
(function(){
  const names = [["Acme Ltd","co"],["Example Co","co"],["Sample Labs","co"],["Sam Admin","p"],["Jo Admin","p"],["Alex Admin","p"]];
  document.getElementById("legend").innerHTML = `<h2>Identity marks</h2>
    <div class="row2">${POOL.map(([n,c])=>`<span class="it"><span class="mk l" style="--c:${c}">${n[0].toUpperCase()}</span>${n} <code style="font:11px var(--mono);color:var(--t3)">${c}</code></span>`).join("")}</div>
    <div class="row2">${names.map(([n,k])=>`<span class="it">${mk(n,k,true)}${n} → ${POOL[fnv1a(n)%8][0]}</span>`).join("")}</div>
    <p>A disc is a person. A rounded square is a company. The colour is FNV-1a (32-bit) of the lower-cased, trimmed name, modulo 8, so a name has the same colour on every screen and every device. State colours (red, amber, green) are never used as identity fills.</p>`;
})();
/* ── Contrast, computed live from the token values (WCAG 2.x). Text needs 4.5, glyphs 3. ── */
(function(){
  const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const lin=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};
  const Lm=r=>.2126*lin(r[0])+.7152*lin(r[1])+.0722*lin(r[2]);
  const rat=(a,b)=>{const x=Lm(a),y=Lm(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  const mix=(f,a,b)=>f.map((c,i)=>Math.round(c*a+b[i]*(1-a)));
  const TH={
    Light:{bg:"#FFFFFF",side:"#F4F5F7",pane:"#FAFBFC",raise:"#F0F2F4",press:"#E6E9ED",ov:[18,24,38],ova:.085,sela:.06,
      t1:"#15181D",t2:"#474D57",t3:"#5A616C",acc:"#44688E",onacc:"#FFFFFF",done:"#1B7448",stuck:"#B3362A",warn:"#8A5A0B",ctl:"#858C97"},
    Dark:{bg:"#14171B",side:"#0E1013",pane:"#191C21",raise:"#20242A",press:"#292E36",ov:[255,255,255],ova:.10,sela:.07,
      t1:"#E9ECF0",t2:"#A7AEB9",t3:"#9AA1AC",acc:"#7BA9DD",onacc:"#0C1522",done:"#5BC48E",stuck:"#F2877C",warn:"#E0A640",ctl:"#6E7681"}};
  const surf=["bg","side","pane","raise","press","open","sel"];
  let h=`<h2 style="margin-top:20px">Contrast, computed live from the token values</h2><p>Text pairs need 4.5:1, glyph and control-border pairs 3:1. “open” is the open-row overlay composed over the page; “sel” is the cursor-row overlay over the page. The markers are the Accent row (the Sky underscore cursor) and the Stuck row (the red dog-ear on blocked tiles and on the pane’s action card) against bg (the column), raise (a resting tile, and the action card) and press (the cursor tile), and sel (the cursor row). They need 3:1; they are held to 4.5 here.</p>`;
  for(const [name,t] of Object.entries(TH)){
    const S2=Object.fromEntries(surf.map(s=>[s,s==="open"?mix(t.ov,t.ova,hx(t.bg)):s==="sel"?mix(t.ov,t.sela,hx(t.bg)):hx(t[s])]));
    const rows=[["Text primary","t1",4.5],["Text secondary","t2",4.5],["Text muted","t3",4.5],["Accent as text","acc",4.5],["Done","done",4.5],["Stuck","stuck",4.5],["Warn","warn",4.5],["Control border","ctl",3]];
    const cell=(v,min)=>`<td style="padding:2px 10px;color:${v>=min?"inherit":"#B3362A"};font-weight:${v>=min?400:700}">${v.toFixed(1)}${v>=min?"":" ✗"}</td>`;
    h+=`<table style="border-collapse:collapse;margin:8px 0 12px;font-size:12px"><caption style="text-align:left;font-weight:600;color:var(--t1);padding:4px 0">${name}</caption><tr><th style="text-align:left;padding:2px 10px 2px 0"></th>${surf.map(s=>`<th style="padding:2px 10px;font-weight:500">${s}</th>`).join("")}</tr>`
      +rows.map(([l,k,min])=>`<tr><td style="padding:2px 10px 2px 0">${l} (${min})</td>${surf.map(s=>cell(rat(hx(t[k]),S2[s]),min)).join("")}</tr>`).join("")
      +`<tr><td style="padding:2px 10px 2px 0">On-accent on accent (4.5)</td>${cell(rat(hx(t.onacc),hx(t.acc)),4.5)}</tr></table>`;
  }
  document.getElementById("legend").insertAdjacentHTML("beforeend",h);
})();
render();
</script>
</body>
