<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molly admin: the three page types (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Nisat, 2026-11-19. Card B-216. Spec: docs/design/page-types-v1.md.
  Placeholders only. Toggles: buttons inside [data-g] groups with data-v values.
    dir    list | detail | editor
    theme  light | dark
    view   desktop (1440) | wide (1920) | phone (390)
    state  normal | long | empty | filters | scrolled | preview
    look   new (proposed) | now (as built today) | old (old look)   -- now/old show screenshots from .visual/
    guides off | on        -- draws every measured box with its number
    lw     fill | cap      -- list width at 1920: fill the frame (today) or a 1296 centred frame
  A hash opens a view directly: page-types-v1.html#dir=editor&theme=dark&view=wide&state=scrolled
-->
<style>
:root{--f:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);background:#C9CDD3;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* ---------- control strip (not part of the design) ---------- */
.strip{position:sticky;top:0;z-index:100;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#0F1216;color:#AEB4BD;font:500 11px/16px var(--f);white-space:nowrap;overflow-x:auto}
.strip .g{display:flex;align-items:center;gap:6px}
.strip .g>span{color:#6F7782;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.strip [data-g]{display:flex;gap:2px;background:#1B2027;border-radius:6px;padding:2px}
.strip [data-g] button{all:unset;cursor:pointer;padding:4px 8px;border-radius:4px;color:#AEB4BD}
.strip [data-g] button:hover{color:#fff}
.strip [data-g] button.on{background:#384150;color:#fff}
.strip .note{color:#E0A640}
.stage{padding:12px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.scaler{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 40px -12px rgba(0,0,0,.35)}
.device[data-view="phone"]{border-radius:28px}
.cap-line{font:500 12px/18px var(--f);color:#3A4048;max-width:1100px;text-align:center}

/* ---------- tokens: the new look as approved (globals.css v2 block) ---------- */
.device[data-theme="light"]{
  --bg:#FFFFFF;--sidebar:#F4F5F7;--surface:#F0F2F4;--well:#E6E9ED;
  --hover:rgba(18,24,38,.035);--sel:rgba(18,24,38,.06);--divider:rgba(18,24,38,.09);--border:rgba(18,24,38,.09);--border-2:rgba(18,24,38,.17);--ctl:#858C97;
  --t1:#15181D;--t2:#474D57;--t3:#5A616C;
  --accent:#44688E;--accent-h:#3A5876;--accent-fg:#FFFFFF;--accent-soft:rgba(68,104,142,.10);--mark:#5B8DC5;
  --done:#1B7448;--warn:#8A5A0B;--stuck:#B3362A;--seg-on:#FFFFFF;--seg-shadow:0 0 0 1px rgba(18,24,38,.09),0 1px 2px rgba(18,24,38,.06);
}
.device[data-theme="dark"]{
  --bg:#14171B;--sidebar:#0E1013;--surface:#20242A;--well:#292E36;
  --hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.07);--divider:rgba(255,255,255,.08);--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);--ctl:#6E7681;
  --t1:#E9ECF0;--t2:#A7AEB9;--t3:#9AA1AC;
  --accent:#7BA9DD;--accent-h:#93BAE6;--accent-fg:#0C1522;--accent-soft:rgba(123,169,221,.16);--mark:#7BA9DD;
  --done:#5BC48E;--warn:#E0A640;--stuck:#F2877C;--seg-on:#292E36;--seg-shadow:0 0 0 1px rgba(255,255,255,.08);
  color-scheme:dark;
}

/* ---------- shell ---------- */
.app{display:flex;height:100%;background:var(--bg);color:var(--t1);font:400 14px/20px var(--f)}
.side{width:224px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.logo{height:52px;flex:none;display:flex;align-items:center;padding:0 24px;font:700 17px/20px var(--f);letter-spacing:-.02em;color:var(--t1)}
.logo .u{color:var(--mark)}
.sb-search{margin:4px 12px 16px;height:36px;flex:none;border:1px solid var(--border-2);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;color:var(--t3);background:var(--bg)}
.sb-search kbd{margin-left:auto;font:500 10px/16px var(--f);border:1px solid var(--border-2);border-radius:4px;padding:0 4px;color:var(--t3)}
.nav{padding:0 12px 12px;overflow:hidden;flex:1;min-height:0}
.nav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;color:var(--t2);text-decoration:none}
.nav a svg{color:var(--t3);flex:none}
.nav a.on{background:var(--sel);color:var(--t1);font-weight:500}
.nav a .c{margin-left:auto;font-size:12px;line-height:18px;color:var(--t3);font-variant-numeric:tabular-nums}
.grp{display:flex;align-items:center;justify-content:space-between;padding:24px 12px 4px;font-size:12px;line-height:18px;color:var(--t3)}
.foot{flex:none;padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--t2)}
.av{width:24px;height:24px;border-radius:50%;background:var(--well);display:grid;place-items:center;font:600 11px/1 var(--f);color:var(--t2);flex:none}
.foot .nm{flex:1;color:var(--t1)}
.main{flex:1;min-width:0;overflow:auto;position:relative;background:var(--bg)}
.mbar{height:52px;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid var(--border);color:var(--t2)}
.mbar .ib{width:44px;height:44px;display:grid;place-items:center}
.mbar .logo{padding:0 4px;height:auto}
.mbar .ib:last-child{margin-left:auto}

/* The page frame (d078cad): a gutter each side, content at most --frame wide, centred. */
.frame{max-width:calc(var(--frame) + 2 * var(--gutter));padding:0 var(--gutter);margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--border-2);background:var(--bg);color:var(--t1);font:500 14px/20px var(--f);white-space:nowrap;cursor:default;flex:none}
.btn svg{flex:none;color:var(--t2)}
.btn.has-i{padding-left:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri svg{color:currentColor}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.sm{height:32px;padding:0 12px}
.btn.sm.has-i{padding-left:8px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:32px}
.btn.dis{opacity:.45}

/* ---------- page head (list and detail) ---------- */
.head{padding-top:40px}
.back{display:inline-flex;align-items:center;gap:4px;height:20px;margin-left:-4px;color:var(--t2);text-decoration:none;font:400 14px/20px var(--f)}
.back svg{color:var(--t3)}
.back+.hrow{margin-top:12px}
.hrow{display:flex;align-items:flex-start;gap:16px;min-height:36px}
.h1{flex:1;min-width:0;margin:0;padding-top:2px;font:600 24px/32px var(--f);letter-spacing:-.012em;color:var(--t1);overflow-wrap:anywhere}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.desc{margin:4px 0 0;color:var(--t2);max-width:720px}
.status{margin:4px 0 0;color:var(--t2);display:flex;flex-wrap:wrap;align-items:center;column-gap:8px}
.status .sep{color:var(--t3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.done{background:var(--done)} .dot.warn{background:var(--warn)} .dot.sky{background:var(--accent)}
.tri{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--warn);margin-right:6px}

/* Condensed bar: appears only after the page title scrolls away. The title moves up into it. */
.sbar{position:sticky;top:0;z-index:20;height:52px;margin-bottom:-52px;background:var(--bg);border-bottom:1px solid var(--border);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity 140ms var(--ease),transform 140ms var(--ease)}
.main.scrolled .sbar{opacity:1;transform:none;pointer-events:auto}
.sbar .in{height:51px;display:flex;align-items:center;gap:12px}
.sbar .tt{flex:1;min-width:0;font:600 14px/20px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .bk{width:32px;height:32px;margin-left:-8px;display:grid;place-items:center;color:var(--t3);border-radius:6px;flex:none}
.sbar .bk+.tt{margin-left:-8px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-top:24px}
.tab{height:40px;display:flex;align-items:center;gap:6px;color:var(--t2);font-weight:500;position:relative;white-space:nowrap}
.tab .n{font-size:12px;line-height:18px;font-weight:400;color:var(--t3);font-variant-numeric:tabular-nums}
.tab.on{color:var(--t1)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:1px;background:var(--accent)}

/* ---------- filter row ---------- */
.frow{position:sticky;top:52px;z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;margin:16px 0 8px}
.tabs+.frow{margin-top:8px}
.search{position:relative;flex:0 1 320px;min-width:280px;max-width:400px;height:36px}
.search .in{height:36px;border:1px solid var(--ctl);border-radius:6px;display:flex;align-items:center;padding:0 36px;color:var(--t3);white-space:nowrap;overflow:hidden}
.search .in.val{color:var(--t1)}
.search>svg{position:absolute;left:12px;top:10px;color:var(--t3)}
.search kbd{position:absolute;right:8px;top:8px;width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--border-2);border-radius:4px;font:500 11px/1 var(--f);color:var(--t3)}
.sel{position:relative;height:36px;min-width:160px;max-width:240px;border:1px solid var(--ctl);border-radius:6px;display:inline-flex;align-items:center;padding:0 36px 0 12px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.sel>span{overflow:hidden;text-overflow:ellipsis}
.sel svg{position:absolute;right:12px;top:10px;color:var(--t3)}
.seg{display:inline-flex;height:36px;padding:2px;gap:2px;border-radius:8px;background:var(--surface);flex:none}
.seg b{height:32px;padding:0 12px;border-radius:6px;display:flex;align-items:center;gap:6px;font-weight:500;color:var(--t2);white-space:nowrap}
.seg b .n{font-size:12px;line-height:18px;font-weight:400;color:var(--t3);font-variant-numeric:tabular-nums}
.seg b.on{background:var(--seg-on);color:var(--t1);box-shadow:var(--seg-shadow)}
.chip{height:36px;display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:0 4px 0 12px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap;flex:none}
.chip .v{color:var(--t1);font-weight:400}
.chip .x{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--t2)}
.addf{height:36px;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--ctl);border-radius:6px;padding:0 12px;color:var(--t2);white-space:nowrap;flex:none}
.clear{height:36px;display:inline-flex;align-items:center;padding:0 8px;color:var(--t2);white-space:nowrap;flex:none}
.fend{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:16px}

/* ---------- table ---------- */
table.t{width:100%;border-collapse:collapse}
.t th{height:40px;padding:0 12px;text-align:left;font:500 12px/18px var(--f);color:var(--t2);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg);position:sticky;top:104px;z-index:4}
.t.nostick th{position:static}
.t td{height:44px;padding:0 12px;border-bottom:1px solid var(--divider);color:var(--t2);white-space:nowrap}
.t th:first-child,.t td:first-child{padding-left:0}
.t th:last-child,.t td:last-child{padding-right:0}
.t td.ti{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--t1);font-weight:500}
.t td.cap{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.t .r{text-align:right}
.t .num{font-variant-numeric:tabular-nums}
.t th .srt{color:var(--t3);margin-left:4px;font-size:10px}
.t tbody tr:hover td{background:var(--hover)}
.t tbody tr:hover td:first-child{box-shadow:-12px 0 0 var(--hover)}
.t tbody tr:hover td:last-child{box-shadow:12px 0 0 var(--hover)}
.t td.empty{color:var(--t2);font-weight:400;max-width:none}
.t td.empty a{color:var(--accent);text-decoration:none;margin-left:8px}
.foot-line{height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--t3)}

/* phone list rows */
.plist .r2{padding:12px 0;border-bottom:1px solid var(--divider);display:flex;flex-direction:column;gap:4px;min-height:64px;justify-content:center}
.plist .r2 .a{font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .r2 .b{font-size:12px;line-height:18px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcount{font-size:12px;line-height:18px;color:var(--t3);margin:0 0 4px}

/* ---------- detail ---------- */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 296px;column-gap:40px;align-items:start;margin-top:32px;padding-bottom:96px}
.sec+.sec{margin-top:48px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:32px;margin-bottom:12px}
.sh h2{margin:0;font:600 16px/24px var(--f);color:var(--t1)}
.sh .m{font-size:12px;line-height:18px;color:var(--t3)}
.prose14{font:400 14px/22px var(--f);color:var(--t1);margin:0;max-width:720px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.stat .l{font-size:12px;line-height:18px;color:var(--t3)}
.stat .v{margin-top:4px;font:600 20px/28px var(--f);font-variant-numeric:tabular-nums;color:var(--t1)}
.stat .d{font-size:12px;line-height:18px;color:var(--t3)}
.panel{position:sticky;top:76px;background:var(--surface);border-radius:8px;padding:24px}
.panel h3{margin:0 0 12px;font:500 12px/18px var(--f);color:var(--t3)}
.facts{display:grid;grid-template-columns:96px minmax(0,1fr);row-gap:8px;column-gap:12px;margin:0}
.facts dt{font-size:12px;line-height:20px;color:var(--t3)}
.facts dd{margin:0;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts dd a,.panel a{color:var(--accent);text-decoration:none}
.prule{height:1px;background:var(--border);margin:16px 0}
.person{display:flex;align-items:center;gap:8px}
.person .e{font-size:12px;line-height:18px;color:var(--t3)}
.dtab-gap{margin-top:16px}

/* ---------- editor ---------- */
.ebar{position:sticky;top:0;z-index:20;height:52px;background:var(--bg);border-bottom:1px solid var(--border)}
.ebar .in{height:51px;display:flex;align-items:center;gap:12px}
.ebar .l{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.ebar .back{flex:none}
.vr{width:1px;height:16px;background:var(--border-2);flex:none}
.est{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t3)}
.est b{font-weight:500;color:var(--t2)}
.est .warn{color:var(--warn)}
.ebody{padding-top:40px;padding-bottom:96px}
.etitle{margin:0;font:600 28px/36px var(--f);letter-spacing:-.015em;color:var(--t1);overflow-wrap:anywhere}
.etitle.ph{color:var(--t3)}
.emeta{margin-top:8px;color:var(--t2)}
.hint{margin-top:8px;font-size:12px;line-height:18px;color:var(--t3);max-width:600px}
.tb{position:sticky;top:52px;z-index:6;background:var(--bg);height:40px;display:flex;align-items:center;gap:0;margin:24px -8px 16px;padding:0;border-bottom:1px solid transparent;transition:border-color 140ms var(--ease)}
.tb.stuck{border-bottom-color:var(--border)}
.tb i{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--t3);font:600 12px/1 var(--f);font-style:normal;flex:none}
.tb .s{width:1px;height:16px;background:var(--border);margin:0 8px;flex:none}
.prose{font:400 16px/28px var(--f);color:var(--t1)}
.prose p{margin:0 0 16px}
.prose h3{margin:32px 0 8px;font:600 18px/28px var(--f)}
.prose ul{margin:0 0 16px;padding-left:24px}
.mention{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.esec{margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.pick .row{height:40px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--divider)}
.pick .row:first-child{border-top:1px solid var(--divider)}
.cb{width:16px;height:16px;border-radius:4px;border:1px solid var(--ctl);flex:none;display:grid;place-items:center}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pick .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .mt{font-size:12px;line-height:18px;color:var(--t3);white-space:nowrap}
.ctlrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ctlrow .search{flex:0 0 240px;min-width:240px}
.sheet .kicker{font-size:12px;line-height:18px;color:var(--t3);margin-bottom:8px}

/* ---------- phone ---------- */
.device[data-view="phone"] .head{padding-top:24px}
.device[data-view="phone"] .h1{font-size:20px;line-height:28px;padding-top:4px}
.device[data-view="phone"] .tabs{margin-top:16px;overflow-x:auto}
.device[data-view="phone"] .frow{position:static;margin:16px 0 8px;padding:0;flex-wrap:wrap;row-gap:8px}
.device[data-view="phone"] .search{flex:1 1 100%;min-width:0;max-width:none;height:44px}
.device[data-view="phone"] .search .in{height:44px;font-size:16px;line-height:24px}
.device[data-view="phone"] .search>svg{top:14px}
.device[data-view="phone"] .search kbd{display:none}
.device[data-view="phone"] .fscroll{flex:1 1 100%;display:flex;gap:8px;overflow-x:auto;margin-right:calc(var(--gutter) * -1);padding-right:var(--gutter)}
.device[data-view="phone"] .fscroll>*{height:44px}
.device[data-view="phone"] .fscroll .seg b{height:40px}
.device[data-view="phone"] .fend{display:none}
.device[data-view="phone"] .dgrid{display:block;margin-top:24px}
.device[data-view="phone"] .panel{position:static;margin-bottom:32px;padding:16px}
.device[data-view="phone"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.device[data-view="phone"] .pacts{display:flex;gap:8px;margin-top:16px}
.device[data-view="phone"] .pacts .btn{height:44px}
.device[data-view="phone"] .pacts .btn.pri{flex:1}
.device[data-view="phone"] .pacts .btn.icon{width:44px}
.device[data-view="phone"] .ebar .back{width:44px;height:44px;margin-left:-12px;justify-content:center}
.device[data-view="phone"] .ebar .in{gap:8px}
.device[data-view="phone"] .ebody{padding-top:24px}
.device[data-view="phone"] .etitle{font-size:24px;line-height:32px}
.device[data-view="phone"] .tb{overflow-x:auto;margin-right:calc(var(--gutter) * -1)}
.device[data-view="phone"] .ctlrow{flex-wrap:wrap}
.device[data-view="phone"] .ctlrow .search{flex:1 1 100%;min-width:0}
.device[data-view="phone"] .sbar .btn.sm{height:36px}

/* ---------- old / today screenshots ---------- */
.shot{width:100%;height:auto;display:block;background:#EEE}
.noshot{height:100%;display:grid;place-items:center;font:500 14px/20px var(--f);color:#5A616C;background:#F4F5F7;padding:24px;text-align:center}

/* ---------- guides ---------- */
.device.guides .frame{outline:1px dashed rgba(0,160,200,.75);outline-offset:-1px}
.device.guides [data-m]{outline:1px dashed rgba(214,51,92,.85);outline-offset:0}
.device.guides [data-m]:not(.stk):not(th):not(.panel){position:relative}
.device.guides [data-m]::after{content:attr(data-m);position:absolute;left:0;top:-13px;z-index:40;font:600 9px/12px var(--f);letter-spacing:.01em;color:#fff;background:#D6335C;padding:0 4px;border-radius:2px;white-space:nowrap;pointer-events:none}

      [["Acme Robotics draft for November","Draft · Nov 19","warn"],["Acme Robotics update, 2026-11","Sent · Nov 9","done"],["Acme Robotics update, 2026-10","Sent · Oct 10","done"],["Acme Robotics update, 2026-09","Sent · Sep 10","done"]].map(function(r){return '<div class="r2"><div class="a">'+r[0]+'</div><div class="b">'+r[1]+'</div></div>';}).join(""))+'</div>';
  } else {
    main+='<table class="t nostick dtab-gap"><tbody>';
    if(empty) main+='<tr><td class="ti empty" colspan="4">No updates yet. They appear here when Acme Robotics publishes one.</td></tr>';
    else [["Acme Robotics draft for November","2026-11","warn","Draft","Nov 19, 2026"],["Acme Robotics update, 2026-11","2026-11","done","Sent","Nov 9, 2026"],["Acme Robotics update, 2026-10","2026-10","done","Sent","Oct 10, 2026"],["Acme Robotics update, 2026-09","2026-09","done","Sent","Sep 10, 2026"],["Acme Robotics update, 2026-08","2026-08","done","Sent","Aug 11, 2026"],["Acme Robotics update, 2026-07","2026-07","done","Sent","Jul 12, 2026"]].forEach(function(r,i){
      main+='<tr><td class="ti"'+(i===0?' data-m="row 44"':'')+'>'+r[0]+'</td><td class="num">'+r[1]+'</td><td>'+(r[2]==="warn"?'<span class="tri"></span>':'<span class="dot done"></span>')+r[3]+'</td><td class="r num">'+r[4]+'</td></tr>';});
    main+='</tbody></table>';
  }
  main+='</section></div>';
  h+='<div class="dgrid" data-m="720 + 40 + 296 = 1056 · 32 under head">'+(ph?panel+main:main+panel)+'</div>';
  return h+'</div>';
}

/* ---------- editor page ---------- */
function editorPage(st,ph){
  var prev=(st==="preview"),long=(st==="long");
  var h='<div class="ebar stk" data-m="bar 52 · one row · everything 14/20, centred"><div class="frame"><div class="in">';
  if(prev){
    h+='<div class="l"><a class="back">'+ic("chevL")+(ph?'':'Report')+'</a><span class="vr"></span><span class="est"><b>Preview</b> · How LPs will see it. Numbers aren’t frozen until you publish.</span></div>';
  } else {
    var stat=long?'<b>Draft</b> in Example Pan-African Agricultural Growth Fund II · Saved 2:41 PM':'<b>Draft</b> in Example Fund I · Saved 2:41 PM';
    h+='<div class="l"><a class="back" data-m="back 14/20">'+ic("chevL")+(ph?'':'Fund Reports')+'</a><span class="vr"></span><span class="est" data-m="status 14/20, truncates">'+stat+'</span></div>';
    if(ph) h+='<span class="btn sm pri">Publish</span><span class="btn sm ghost icon">'+ic("more")+'</span>';
    else h+='<div class="acts" data-m="buttons 32 · gap 8 · 10 above and below"><span class="btn sm has-i">'+ic("eye")+'Preview</span><span class="btn sm">Save</span><span class="btn sm pri">Publish</span><span class="btn sm ghost icon">'+ic("more")+'</span></div>';
  }
  h+='</div></div></div><div class="frame"><div class="ebody">';
  if(prev){
    h+='<div class="sheet"><div class="kicker">Example Fund I · H1 2026</div><h1 class="etitle">Example Fund I: H1 2026 Report</h1><div class="prose" style="margin-top:24px">'+proseBody()+'</div></div>';
    return h+'</div></div>';
  }
  var t=long?"Example Pan-African Agricultural Growth Fund II: H1 2026 report to limited partners, with the restated Q1 valuations":"Example Fund I: H1 2026 Report";
  h+='<h1 class="etitle" id="h1" data-m="title field 28/36 600 · grows, never clips">'+t+'</h1>';
  h+='<div class="emeta" data-m="meta 14/20 · 8 under">H1 2026 · Example Fund I · 12 LPs</div>';
  h+='<div class="hint">Type @ to mention a portfolio company. The chart button adds this fund’s performance snapshot.</div>';
  h+='<div class="tb stk" id="tb" data-m="toolbar 40 · sticky under bar · 24 above, 16 below"><i>'+ic("undo")+'</i><i>'+ic("redo")+'</i><span class="s"></span><i>H2</i><i>H3</i><span class="s"></span><i>'+ic("bold")+'</i><i>'+ic("ital")+'</i><i>'+ic("under")+'</i><span class="s"></span><i>'+ic("ul")+'</i><i>'+ic("ol")+'</i><i>'+ic("quote")+'</i><span class="s"></span><i>'+ic("link")+'</i><i>'+ic("chart")+'</i></div>';
  h+='<div class="prose" data-m="body 16/28 · paragraphs 16 apart">'+proseBody()+'</div>';
  h+='<section class="esec" data-m="bottom section: 48 above, hairline, 24 to heading"><div class="sh"><h2>Shared with</h2><span class="m">12 LPs in Example Fund I</span></div>';
  h+='<div class="ctlrow"><div class="search">'+ic("search")+'<div class="in">Filter LPs</div></div><span class="btn">Select all</span><span class="btn ghost">Clear</span></div>';
  h+='<div class="pick" data-m="picker rows 40">'+[["Example Pension Trust","ops@example.com",1],["Acme Family Office","sam@example.com",1],["Globex Endowment","lp@example.org",1],["Initech Partners","finance@example.net",0]].map(function(r){return '<div class="row"><span class="cb'+(r[2]?" on":"")+'">'+(r[2]?ic("check",12):"")+'</span><span class="nm">'+r[0]+'</span><span class="mt">'+r[1]+'</span></div>';}).join("")+'</div></section>';
  h+='<section class="esec"><div class="sh"><h2>Attachments</h2><span class="btn sm ghost has-i">'+ic("paper")+'Add file</span></div><div class="pick"><div class="row"><span class="nm">Example Fund I H1 2026 financial statements.pdf</span><span class="mt">2.4 MB</span></div></div></section>';
  return h+'</div></div>';
}
function proseBody(){
  return '<p>The first half closed with the portfolio broadly on plan. Seven of nine companies grew revenue quarter on quarter, and two raised follow-on rounds led by outside investors.</p>'
   +'<h3>Portfolio highlights</h3><p><span class="mention">Acme Robotics</span> doubled its leased fleet to 140 pickers and signed its first distributor outside Nigeria. <span class="mention">Globex Energy</span> is behind plan on installations after a supply delay, and we have agreed a revised milestone with the team.</p>'
   +'<ul><li>Two follow-on rounds closed, both at a step-up.</li><li>One write-down, covered in the valuations section.</li><li>Fund I is 82% deployed.</li></ul>'
   +'<h3>Valuations</h3><p>Marks follow the policy agreed with the advisory committee in March. Figures are as of June 30, 2026 and are not frozen until the report is published.</p>'
   +'<p>We will send the H2 report in the third week of January.</p>';
}

/* ---------- screenshots for Today and Old look ---------- */
var V=".."+"/"+".."+"/.visual/";
var SHOTS={
 old:{list:{desktop:"20261119-202535/updates__old-light__desktop.png",wide:"20261119-192143/updates__old-light__wide.png"},
      detail:{desktop:"20261119-185723/company__old-light__desktop.png",wide:"20261119-185723/company__old-light__wide.png",phone:"20261119-185723/company__old-light__phone.png"},
      editor:{desktop:"20261119-205439/report-detail__old-light__desktop.png",wide:"20261119-205439/report-detail__old-light__wide.png",phone:"20261119-193049/report-detail__old-light__phone.png"}},
 now:{list:{desktop:"20261119-202535/updates__new-light__desktop.png",wide:"20261119-192143/updates__new-light__wide.png"},
      detail:{desktop:"20261119-190608/company__new-light__desktop.png",wide:"20261119-190608/company__new-light__wide.png",phone:"20261119-190608/company__new-light__phone.png"},
      editor:{desktop:"20261119-205439/report-detail__new-light__desktop.png",wide:"20261119-210205/report-detail__new-light__wide.png",phone:"20261119-210205/report-detail__new-light__phone.png"}}
};

/* ---------- render ---------- */
var device=document.getElementById("device"),scaler=document.getElementById("scaler");
function readHash(){location.hash.replace(/^#/,"").split("&").forEach(function(kv){var p=kv.split("=");if(p[0] in S&&p[1])S[p[0]]=decodeURIComponent(p[1]);});}
function writeHash(){var a=[];for(var k in S)a.push(k+"="+S[k]);history.replaceState(null,"","#"+a.join("&"));}
function fit(){
  var d=DIMS[S.view],W=d[0],sc=Math.min(1,(window.innerWidth-32)/W);
  var H=S.view==="phone"?d[1]:Math.max(d[1]*0.75,Math.round((window.innerHeight-44-24)/sc));
  device.style.width=W+"px";device.style.height=H+"px";device.style.transform="scale("+sc+")";
  scaler.style.width=(W*sc)+"px";scaler.style.height=(H*sc)+"px";
}
function render(){
  document.querySelectorAll("[data-g]").forEach(function(g){var k=g.getAttribute("data-g");g.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-v")===S[k]);});});
  var st=VALID[S.dir].indexOf(S.state)>=0?S.state:"normal";
  document.getElementById("note").textContent=st!==S.state?("“"+S.state+"” does not apply to this page type; showing Normal"):"";
  device.setAttribute("data-theme",S.theme);device.setAttribute("data-view",S.view);
  device.classList.toggle("guides",S.guides==="on");
  var ph=S.view==="phone";
  device.style.setProperty("--gutter",GUT[S.view]+"px");
  device.style.setProperty("--frame",S.dir==="list"?(S.lw==="cap"?"1296px":"100000px"):S.dir==="detail"?"1056px":"720px");
  fit();
  var cap={list:"List page · Updates (Companies in “Many filters”) · title is a real heading; filters sit together on the left; the right end holds only the count and view controls.",
           detail:"Detail page · company record (Dossier) · back link, title row with actions, status line; 720 main + 296 panel.",
           editor:"Editor page · fund report · one 52px bar, one baseline, 32px buttons; 720 writing column."}[S.dir];
  if(S.look!=="new"){
    var src=(SHOTS[S.look][S.dir]||{})[S.view];
    device.innerHTML=src?'<img class="shot" alt="" src="'+V+src+'" onerror="this.outerHTML=\'<div class=noshot>Screenshot not found in .visual/ on this Mac.</div>\'">'
      :'<div class="noshot">No '+(S.look==="old"?"old-look":"current")+' screenshot of this page at this size.</div>';
    document.getElementById("capline").textContent=(S.look==="old"?"Old look, ":"Today, ")+"light, from .visual/ screenshots. Compare with Proposed at the same size.";
    return;
  }
  document.getElementById("capline").textContent=cap;
  var active=S.dir==="list"?(st==="filters"?"Companies":"Updates"):S.dir==="detail"?"Companies":"Fund Reports";
  var page=S.dir==="list"?listPage(st,ph):S.dir==="detail"?detailPage(st,ph):editorPage(st,ph);
  device.innerHTML='<div class="app">'+(ph?"":sidebar(active))+'<div class="main" id="main">'+(ph?mbar():"")+page+'</div></div>';
  var main=document.getElementById("main");
  function onScroll(){
    var h1=document.getElementById("h1");
    if(h1){var y=0,n=h1;while(n&&n!==main){y+=n.offsetTop;n=n.offsetParent;}main.classList.toggle("scrolled",S.dir!=="editor"&&main.scrollTop>y+h1.offsetHeight-12);}
    var tb=document.getElementById("tb");
    if(tb){tb.classList.toggle("stuck",tbTop>0&&main.scrollTop>=tbTop-53);}
  }
  // The toolbar's resting position (measured once, before any scroll), so "stuck" is exact.
  var tbEl=document.getElementById("tb"),tbTop=0;
  if(tbEl){var n2=tbEl;while(n2&&n2!==main){tbTop+=n2.offsetTop;n2=n2.offsetParent;}}
  // Table headers stick under the filter row, whatever its height (it wraps when there are many filters).
  var fr=main.querySelector(".frow.stk");
  main.querySelectorAll(".t th").forEach(function(th){th.style.top=fr?(52+fr.offsetHeight)+"px":"52px";});
  main.addEventListener("scroll",onScroll);
  if(st==="scrolled") main.scrollTop=S.dir==="editor"?(ph?260:300):(ph?220:200);
  onScroll();
}
document.querySelectorAll("[data-g]").forEach(function(g){
  g.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S[g.getAttribute("data-g")]=b.getAttribute("data-v");writeHash();render();});
});
window.addEventListener("resize",fit);
readHash();render();
})();
</script>
